# drobo-webui's own lighttpd (drobo-webui.service). Debian's lighttpd.service is left disabled.
# Change server.port here if something else should have port 80, then:
#   sudo systemctl restart drobo-webui
server.port          = 80
server.username      = "www-data"
server.groupname     = "www-data"
server.document-root = "/usr/share/drobo-webui/public"
server.tag           = ""
server.modules       = ( "mod_access", "mod_fastcgi", "mod_setenv" )
index-file.names     = ( "index.php" )
url.access-deny      = ( "~", ".inc", ".bak" )

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".js"   => "text/javascript; charset=utf-8",
  ".css"  => "text/css; charset=utf-8",
  ".svg"  => "image/svg+xml",
  ".png"  => "image/png",
  ".json" => "application/json",
  ".woff2" => "font/woff2",
)

setenv.add-response-header = (
  "X-Content-Type-Options" => "nosniff",
  "X-Frame-Options"        => "DENY",
  "Referrer-Policy"        => "same-origin",
  "Content-Security-Policy" => "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'",
)

fastcgi.server = ( ".php" => ((
  "bin-path"        => "/usr/bin/php-cgi",
  "socket"          => "/run/drobo-webui/fcgi/php.sock",
  "max-procs"       => 1,
  "bin-environment" => ( "PHP_FCGI_CHILDREN" => "2", "PHP_FCGI_MAX_REQUESTS" => "500" ),
)))
