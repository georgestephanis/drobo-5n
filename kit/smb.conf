# Drobo 5N file sharing. Stock Debian file: /etc/samba/smb.conf.debian-orig
[global]
   workgroup = WORKGROUP
   server string = Drobo 5N
   server role = standalone server
   map to guest = never
   security = user
   server min protocol = SMB2_10
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   obey pam restrictions = yes
   unix password sync = no
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # macOS: Finder metadata, resource forks, Time Machine support
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = RackMac
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[Drobo]
   comment = Drobo share
   path = /srv/drobo
   valid users = georgestephanis
   read only = no
   browseable = yes
   create mask = 0664
   directory mask = 0775
