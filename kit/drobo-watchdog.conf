# /etc/systemd/system.conf.d/drobo-watchdog.conf
# The SoC watchdog (orion_wdt, max 171 s) resets the whole board. systemd pets it while running;
# if the system hangs for a minute, the board resets (and U-Boot's fallback takes over if a new
# kernel is at fault). During a reboot the timeout is 3 minutes.
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=3min
